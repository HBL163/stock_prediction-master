name: 股票代码在线分析

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: "输入 A 股代码，例如 000001、600519.SH、300750.SZ"
        required: true
        type: string
      history_years:
        description: "历史数据范围（预留，当前默认近 3 年）"
        required: false
        default: "3"
        type: choice
        options:
          - "3"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-online.txt
      - name: 安装在线分析依赖
        run: python -m pip install --upgrade pip && pip install -r requirements-online.txt
      - name: 运行股票分析
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
        run: python scripts/online_analyze.py --code "$STOCK_CODE" --output output
      - name: 上传分析报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
