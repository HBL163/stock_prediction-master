name: 股票代码全维度分析

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: "输入 A 股代码，例如 000001、600519.SH、300750.SZ"
        required: true
        type: string
      history_years:
        description: "历史行情范围"
        required: true
        default: "3"
        type: choice
        options:
          - "2"
          - "3"
          - "5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stock-analysis-${{ github.ref }}-${{ inputs.stock_code }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-online.txt
      - name: 安装在线研究依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-online.txt
          python -m pip install pytest
      - name: 运行在线系统单元测试
        run: python -m pytest -q tests/test_online_system.py tests/test_online_analyze.py tests/test_news_research.py
      - name: 运行股票研究流水线
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
          HISTORY_YEARS: ${{ inputs.history_years }}
        run: |
          python scripts/online_analyze.py --code "$STOCK_CODE" --years "$HISTORY_YEARS" --output output
      - name: 准备 HTML 报告网站
        run: |
          mkdir -p site
          cp output/*_analysis.html site/report.html
          cp output/*_chart.png site/chart.png
          cp output/*_forecast.json site/forecast.json
          cp output/*_features.csv site/features.csv
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=report.html"><title>AI 股票分析报告</title></head><body><p><a href="report.html">打开 HTML 股票分析报告</a></p></body></html>
          HTML
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: 发布在线网站
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 上传完整研究报告
        id: report_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-research-${{ inputs.stock_code }}-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: 输出分析报告链接
        if: always()
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}report.html
          ARTIFACT_URL: ${{ steps.report_artifact.outputs.artifact-url }}
          STOCK_CODE: ${{ inputs.stock_code }}
        run: |
          {
            echo "## ${STOCK_CODE} HTML 股票分析报告已完成"
            echo
            if [ -n "$REPORT_URL" ]; then
              echo "- **HTML 在线报告：** [点击直接查看完整报告]($REPORT_URL)"
            fi
            if [ -n "$ARTIFACT_URL" ]; then
              echo "- **完整报告文件包：** [点击下载分析文件]($ARTIFACT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
