name: 股票代码全维度分析

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: "输入 A 股代码，例如 000001、600519.SH、300750.SZ"
        required: true
        type: string
      history_years:
        description: "历史行情范围"
        required: true
        default: "3"
        type: choice
        options:
          - "2"
          - "3"
          - "5"
      include_context:
        description: "尝试抓取公司资料和新闻情绪"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: read

concurrency:
  group: stock-analysis-${{ github.ref }}-${{ inputs.stock_code }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-online.txt
      - name: 安装在线研究依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-online.txt
          python -m pip install pytest
      - name: 运行在线系统单元测试
        run: python -m pytest -q tests/test_online_system.py tests/test_online_analyze.py
      - name: 运行股票研究流水线
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
          HISTORY_YEARS: ${{ inputs.history_years }}
          INCLUDE_CONTEXT: ${{ inputs.include_context }}
        run: |
          if [ "$INCLUDE_CONTEXT" = "no" ]; then
            python scripts/online_analyze.py --code "$STOCK_CODE" --years "$HISTORY_YEARS" --skip-context --output output
          else
            python scripts/online_analyze.py --code "$STOCK_CODE" --years "$HISTORY_YEARS" --output output
          fi
      - name: 上传完整研究报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-research-${{ inputs.stock_code }}-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
