name: 股票代码全维度分析

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: "输入 A 股代码，例如 000001、600519.SH、300750.SZ"
        required: true
        type: string
      history_years:
        description: "历史行情范围"
        required: true
        default: "3"
        type: choice
        options:
          - "2"
          - "3"
          - "5"
      include_context:
        description: "自动抓取全球公司、行业和宏观新闻"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stock-analysis-${{ github.ref }}-${{ inputs.stock_code }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-online.txt
      - name: 安装在线研究依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-online.txt
          python -m pip install pytest
      - name: 运行在线系统单元测试
        run: python -m pytest -q tests/test_online_system.py tests/test_online_analyze.py
      - name: 运行股票研究流水线
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
          HISTORY_YEARS: ${{ inputs.history_years }}
          INCLUDE_CONTEXT: ${{ inputs.include_context }}
        run: |
          python scripts/online_analyze.py --code "$STOCK_CODE" --years "$HISTORY_YEARS" --output output
      - name: 准备在线展示页面
        run: |
          mkdir -p site
          cp output/*_analysis.md site/report.md
          cp output/*_forecast.json site/forecast.json
          cp output/*_chart.png site/chart.png
          cp output/*_features.csv site/features.csv
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AI 股票研究报告</title>
          <style>body{font:16px/1.7 system-ui,sans-serif;max-width:1000px;margin:36px auto;padding:0 18px;color:#182230}h1{font-size:28px}img{max-width:100%;border:1px solid #ddd;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fa;padding:20px;border-radius:12px}a{color:#0969da}</style>
          <h1>AI 股票研究报告</h1><p>本页面展示最近一次 GitHub Actions 分析生成的结果。要分析其他股票，请在仓库 Actions 中运行“股票代码全维度分析”并输入代码。</p>
          <p><a href="forecast.json">预测数据 JSON</a> · <a href="features.csv">模型特征 CSV</a></p>
          <h2>价格图表</h2><img src="chart.png" alt="股票价格与预测图表">
          <h2>完整研究报告</h2><pre id="report">正在加载报告…</pre>
          <script>fetch('report.md').then(r=>{if(!r.ok)throw Error('报告加载失败');return r.text()}).then(t=>document.querySelector('#report').textContent=t).catch(e=>document.querySelector('#report').textContent=e.message)</script>
          </html>
          HTML
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: 发布在线网站
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 上传完整研究报告
        id: report_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-research-${{ inputs.stock_code }}-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: 输出分析报告链接
        if: always()
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}report.md
          ARTIFACT_URL: ${{ steps.report_artifact.outputs.artifact-url }}
          STOCK_CODE: ${{ inputs.stock_code }}
        run: |
          {
            echo "## ${STOCK_CODE} 股票分析已完成"
            echo
            if [ -n "$REPORT_URL" ]; then
              echo "- **在线分析报告：** [点击直接查看报告]($REPORT_URL)"
            fi
            if [ -n "$ARTIFACT_URL" ]; then
              echo "- **完整报告文件包：** [点击下载分析文件]($ARTIFACT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
